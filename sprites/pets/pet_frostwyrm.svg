<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Frostwyrm — Frostling's evolution. The snowflake has uncoiled into a
       serpent: a horned drake skull over a plated body that winds away below.

       Where Blaze evolves OUTWARD into wings, this one evolves DOWNWARD into a
       coil, so the two evolutions do not share a silhouette either. The plates
       are separate islands down the spine, which is what gives the coil its
       segmented read at small sizes. -->
  <defs>
    <radialGradient id="au" cx="50%" cy="46%" r="52%">
      <stop offset="0.28" stop-color="#7dd3fc" stop-opacity="0.46"/>
      <stop offset="0.66" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skull" x1="0.3" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#dbeafe"/>
      <stop offset="0.66" stop-color="#7fb4ee"/>
      <stop offset="1" stop-color="#255d9f"/>
    </linearGradient>
    <linearGradient id="coil" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#bcd8f5"/>
      <stop offset="0.5" stop-color="#5a9fe6"/>
      <stop offset="1" stop-color="#1e4f8a"/>
    </linearGradient>
    <linearGradient id="horn" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset="1" stop-color="#2f6fbd"/>
    </linearGradient>
    <radialGradient id="eye" cx="50%" cy="46%" r="52%">
      <stop offset="0.20" stop-color="#ffffff"/>
      <stop offset="0.52" stop-color="#e9deff"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.15"/>
    </radialGradient>
  </defs>

  <circle cx="256" cy="256" r="244" fill="url(#au)"/>

  <!-- Horns and frill, behind the skull. -->
  <path fill="url(#horn)" d="M206 128 C 178 88 152 62 116 42 C 158 72 188 106 210 140 Z"/>
  <path fill="url(#horn)" d="M306 128 C 334 88 360 62 396 42 C 354 72 324 106 302 140 Z"/>
  <path fill="url(#horn)" d="M232 108 C 226 74 218 50 202 22 C 232 52 248 84 252 106 Z"/>
  <path fill="url(#horn)" d="M280 108 C 286 74 294 50 310 22 C 280 52 264 84 260 106 Z"/>
  <path fill="#5a9fe6" fill-opacity="0.55" d="M170 200 C 140 210 116 228 98 254 C 130 240 156 232 178 230 Z"/>
  <path fill="#5a9fe6" fill-opacity="0.55" d="M342 200 C 372 210 396 228 414 254 C 382 240 356 232 334 230 Z"/>

  <!-- The coil, winding down and away. Behind the skull. -->
  <path fill="url(#coil)" d="
    M204 292 C 172 330 168 376 196 408
    C 228 444 288 448 330 424
    C 366 404 384 370 380 336
    C 372 372 344 398 306 406
    C 268 414 232 402 216 378
    C 200 354 204 320 226 296 Z"/>
  <path fill="#eaf3ff" fill-opacity="0.30" d="
    M204 292 C 180 322 174 358 190 386 L 216 378 C 200 354 204 320 226 296 Z"/>
  <!-- Spine plates: separate islands, so the coil reads segmented. -->
  <polygon points="196,330 176,318 184,352" fill="#7fb4ee"/>
  <polygon points="198,376 176,374 190,404" fill="#7fb4ee"/>
  <polygon points="232,412 220,434 252,432" fill="#7fb4ee"/>
  <polygon points="288,428 284,452 314,438" fill="#7fb4ee"/>
  <polygon points="344,406 356,430 372,404" fill="#7fb4ee"/>
  <!-- Tail fin. -->
  <path fill="url(#coil)" d="M380 336 L418 306 L404 350 L432 356 L386 372 Z"/>

  <!-- Skull. Holes: eye sockets and a nostril slit. -->
  <path fill="url(#skull)" fill-rule="evenodd" d="
    M256 116
    C 306 124 342 158 348 208
    C 352 244 340 276 314 296
    C 300 308 292 322 288 340
    L 272 318 L 256 342 L 240 318 L 224 340
    C 220 322 212 308 198 296
    C 172 276 160 244 164 208
    C 170 158 206 124 256 116 Z

    M 218 226 m -25 0 a 25 22 0 1 0 50 0 a 25 22 0 1 0 -50 0 Z
    M 294 226 m -25 0 a 25 22 0 1 0 50 0 a 25 22 0 1 0 -50 0 Z
    M 248 278 L 264 278 L 268 300 L 244 300 Z
  "/>
  <polygon points="256,132 330,196 256,224 182,196" fill="#ffffff" fill-opacity="0.34"/>
  <polygon points="182,196 256,224 240,318 198,296" fill="#ffffff" fill-opacity="0.12"/>
  <polygon points="330,196 256,224 272,318 314,296" fill="#173b6b" fill-opacity="0.20"/>

  <ellipse cx="218" cy="226" rx="17" ry="14" fill="url(#eye)"/>
  <ellipse cx="294" cy="226" rx="17" ry="14" fill="url(#eye)"/>
  <ellipse cx="213" cy="221" rx="6" ry="5" fill="#ffffff"/>
  <ellipse cx="289" cy="221" rx="6" ry="5" fill="#ffffff"/>

  <circle cx="106" cy="130" r="7" fill="#bfe3ff" fill-opacity="0.75"/>
  <circle cx="410" cy="140" r="6" fill="#bfe3ff" fill-opacity="0.75"/>
</svg>
