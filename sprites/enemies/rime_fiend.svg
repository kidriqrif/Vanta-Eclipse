<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Rime Fiend — Frozen Ruins. A predator grown out of a shattered ice
       floe: an angular crystal skull, a fractured shoulder mantle and a
       forest of shards.

       It used to be a single cube. The whole read now comes from FACETS — each
       plane a slightly different value, so the crystal turns in the light —
       and from gaps cut clean through the mantle, which the shader bevels. -->
  <defs>
    <radialGradient id="aura" cx="50%" cy="52%" r="52%">
      <stop offset="0.34" stop-color="#3b82f6" stop-opacity="0.28"/>
      <stop offset="0.74" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ice_hi" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#eaf4ff"/>
      <stop offset="0.45" stop-color="#9ec5f8"/>
      <stop offset="1" stop-color="#3c6fd4"/>
    </linearGradient>
    <linearGradient id="ice_mid" x1="0.2" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ba7ef"/>
      <stop offset="0.6" stop-color="#2f56b4"/>
      <stop offset="1" stop-color="#16296b"/>
    </linearGradient>
    <linearGradient id="ice_low" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b4da8"/>
      <stop offset="0.6" stop-color="#172c6f"/>
      <stop offset="1" stop-color="#0b1640"/>
    </linearGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="52%">
      <stop offset="0.18" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#d8ecff"/>
      <stop offset="0.75" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.1"/>
    </radialGradient>
  </defs>

  <circle cx="256" cy="286" r="232" fill="url(#aura)"/>

  <!-- Crown of shards behind the head, each its own island. -->
  <polygon points="196,158 158,52 224,136" fill="#20408f"/>
  <polygon points="256,132 250,26 292,124" fill="#2f56b4"/>
  <polygon points="318,158 358,66 328,150" fill="#20408f"/>
  <polygon points="150,224 76,166 142,246" fill="#1a3378"/>
  <polygon points="362,224 436,172 370,246" fill="#1a3378"/>

  <!-- Mantle: a broken collar of ice with two gaps cut right through it. -->
  <path fill="url(#ice_low)" fill-rule="evenodd" d="
    M256 214 L392 268 L410 356 L346 396 L256 372 L166 396 L102 356 L120 268 Z
    M 168 300 L 214 288 L 210 336 L 164 340 Z
    M 344 300 L 300 288 L 304 336 L 348 340 Z
  "/>

  <!-- Skull: five facets, no two the same value, plus cut eye sockets. -->
  <path fill="url(#ice_mid)" fill-rule="evenodd" d="
    M256 156 L344 216 L332 322 L256 380 L180 322 L168 216 Z
    M 214 268 L 246 258 L 242 296 L 208 300 Z
    M 298 268 L 266 258 L 270 296 L 304 300 Z
  "/>
  <polygon points="256,156 344,216 256,246 168,216" fill="url(#ice_hi)"/>
  <polygon points="168,216 256,246 256,380 180,322" fill="#7ba7ef" fill-opacity="0.22"/>
  <polygon points="344,216 256,246 256,380 332,322" fill="#0b1640" fill-opacity="0.35"/>
  <polygon points="196,204 232,190 226,232" fill="#f2f8ff" fill-opacity="0.65"/>
  <polygon points="286,196 316,210 296,230" fill="#f2f8ff" fill-opacity="0.3"/>

  <!-- Eyes behind the sockets, so the cut edge frames them. -->
  <ellipse cx="226" cy="280" rx="19" ry="21" fill="url(#eye)"/>
  <ellipse cx="286" cy="280" rx="19" ry="21" fill="url(#eye)"/>
  <ellipse cx="222" cy="273" rx="6" ry="7" fill="#ffffff" fill-opacity="0.9"/>
  <ellipse cx="282" cy="273" rx="6" ry="7" fill="#ffffff" fill-opacity="0.9"/>

  <!-- Jaw of icicles, hanging free of the skull. -->
  <polygon points="212,384 224,436 236,388" fill="#2b4da8"/>
  <polygon points="242,390 256,452 270,390" fill="#3c6fd4"/>
  <polygon points="276,388 288,436 300,384" fill="#2b4da8"/>
  <polygon points="188,372 176,410 200,392" fill="#1a3378"/>
  <polygon points="324,372 336,410 312,392" fill="#1a3378"/>
</svg>
