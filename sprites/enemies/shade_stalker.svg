<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Shade Stalker — Dark Forest. A cloaked hunter: a deep empty hood, a
       cloak slashed to ribbons, and thin claws out of the sleeves.

       The slashes are cut CLEAN THROUGH the alpha rather than painted dark, so
       each tear gets its own lit edge and the garment reads as cloth with
       thickness instead of a flat black cutout. -->
  <defs>
    <radialGradient id="aura" cx="50%" cy="40%" r="52%">
      <stop offset="0.32" stop-color="#38bdf8" stop-opacity="0.24"/>
      <stop offset="0.72" stop-color="#38bdf8" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloak" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#2b3c60"/>
      <stop offset="0.38" stop-color="#1a2743"/>
      <stop offset="0.72" stop-color="#0f1628"/>
      <stop offset="1" stop-color="#05080f"/>
    </linearGradient>
    <radialGradient id="hood" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#000206"/>
      <stop offset="0.7" stop-color="#04070e"/>
      <stop offset="1" stop-color="#0b1220"/>
    </radialGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="52%">
      <stop offset="0.16" stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#dff5ff"/>
      <stop offset="0.72" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.12"/>
    </radialGradient>
  </defs>

  <circle cx="256" cy="224" r="236" fill="url(#aura)"/>

  <!-- Cloak. Holes: three slashes through the skirt and a gap under each arm,
       so the hem reads as separate hanging strips. -->
  <path fill="url(#cloak)" fill-rule="evenodd" d="
    M256 30
    C 208 52 176 96 168 148
    C 140 178 122 226 116 286
    C 110 342 116 396 130 442
    C 140 424 152 414 164 414
    C 158 442 156 468 160 492
    L 186 452 L 206 496 L 230 448 L 250 490 L 262 448 L 284 494 L 306 448
    L 328 492 L 352 452 L 376 490
    C 380 466 378 440 372 414
    C 384 414 396 424 406 442
    C 420 396 426 342 420 286
    C 414 226 396 178 368 148
    C 360 96 328 52 280 30 Z

    M 210 300 L 226 296 L 232 402 L 212 400 Z
    M 302 300 L 286 296 L 280 402 L 300 400 Z
    M 248 322 L 264 322 L 266 408 L 246 408 Z
    M 150 232 C 162 252 168 286 166 318 L 146 300 C 142 272 144 250 150 232 Z
    M 362 232 C 350 252 344 286 346 318 L 366 300 C 370 272 368 250 362 232 Z
  "/>

  <!-- Shoulder mantle: a heavier band across the top of the cloak. -->
  <path fill="#31456d" fill-opacity="0.45" d="
    M176 146 C 208 122 304 122 336 146
    C 350 168 358 196 362 226
    C 330 190 296 174 256 172
    C 216 174 182 190 150 226
    C 154 196 162 168 176 146 Z"/>

  <!-- The hood interior: a void with a soft inner wall, not a flat black oval. -->
  <ellipse cx="256" cy="184" rx="78" ry="96" fill="url(#hood)"/>
  <path fill="#1b2b48" fill-opacity="0.55" d="
    M256 92 C 214 100 186 132 180 176 C 196 140 224 118 256 112 Z"/>

  <ellipse cx="228" cy="186" rx="21" ry="13" fill="url(#eye)" transform="rotate(-14 228 186)"/>
  <ellipse cx="284" cy="186" rx="21" ry="13" fill="url(#eye)" transform="rotate(14 284 186)"/>
  <ellipse cx="226" cy="184" rx="7" ry="4" fill="#ffffff" transform="rotate(-14 226 184)"/>
  <ellipse cx="282" cy="184" rx="7" ry="4" fill="#ffffff" transform="rotate(14 282 184)"/>

  <!-- Claws out of the sleeves — separate islands, so they rim independently. -->
  <path fill="#25344f" d="M132 322 L112 356 L124 360 L120 388 L134 372 L142 392 L148 356 Z"/>
  <path fill="#25344f" d="M380 322 L400 356 L388 360 L392 388 L378 372 L370 392 L364 356 Z"/>
  <path fill="#7dd3fc" fill-opacity="0.35" d="M132 322 L124 348 L136 344 Z"/>
  <path fill="#7dd3fc" fill-opacity="0.35" d="M380 322 L388 348 L376 344 Z"/>
</svg>
