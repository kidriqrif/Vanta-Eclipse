<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Thorn Fiend — Dark Forest. A knot of living bramble: a woody mass with
       gaps torn through the tangle, six eyes rather than two, and barbs that
       curve instead of pointing straight out.

       The curved barbs and the holes in the tangle are what separate it from
       the Rime Fiend, which is the other spiked silhouette in the game — that
       one is straight, faceted and cold, this one hooked, organic and warm. -->
  <defs>
    <radialGradient id="aura" cx="50%" cy="54%" r="52%">
      <stop offset="0.34" stop-color="#4ade80" stop-opacity="0.26"/>
      <stop offset="0.74" stop-color="#4ade80" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="body" cx="42%" cy="34%" r="74%">
      <stop offset="0" stop-color="#3c6142"/>
      <stop offset="0.4" stop-color="#26432c"/>
      <stop offset="0.74" stop-color="#152a1c"/>
      <stop offset="1" stop-color="#08140d"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#4a7351"/>
      <stop offset="0.6" stop-color="#1d3524"/>
      <stop offset="1" stop-color="#0a1710"/>
    </linearGradient>
    <radialGradient id="eye" cx="50%" cy="48%" r="52%">
      <stop offset="0.18" stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#e6fff0"/>
      <stop offset="0.72" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0.12"/>
    </radialGradient>
  </defs>

  <circle cx="256" cy="292" r="232" fill="url(#aura)"/>

  <!-- Back barbs, hooked. Behind the mass so they read as depth. -->
  <path fill="#16301e" d="M164 178 C 130 132 106 106 74 92 C 116 108 148 136 176 172 Z"/>
  <path fill="#16301e" d="M348 178 C 382 132 406 106 438 92 C 396 108 364 136 336 172 Z"/>
  <path fill="#1d3524" d="M226 148 C 220 96 214 66 198 34 C 226 66 244 108 250 144 Z"/>
  <path fill="#1d3524" d="M286 148 C 292 96 298 66 314 34 C 286 66 268 108 262 144 Z"/>
  <path fill="#16301e" d="M126 302 C 82 286 54 274 26 250 C 62 282 96 306 128 322 Z"/>
  <path fill="#16301e" d="M386 302 C 430 286 458 274 486 250 C 450 282 416 306 384 322 Z"/>

  <!-- The bramble mass. Holes: two torn gaps through the tangle and six eye
       sockets, so the whole body is pierced rather than solid. -->
  <path fill="url(#body)" fill-rule="evenodd" d="
    M256 158
    C 322 158 384 196 406 250
    C 426 300 418 358 384 396
    C 348 436 300 452 256 452
    C 212 452 164 436 128 396
    C 94 358 86 300 106 250
    C 128 196 190 158 256 158 Z

    M 214 286 m -25 0 a 25 21 0 1 0 50 0 a 25 21 0 1 0 -50 0 Z
    M 298 286 m -25 0 a 25 21 0 1 0 50 0 a 25 21 0 1 0 -50 0 Z
    M 172 230 m -14 0 a 14 12 0 1 0 28 0 a 14 12 0 1 0 -28 0 Z
    M 340 230 m -14 0 a 14 12 0 1 0 28 0 a 14 12 0 1 0 -28 0 Z
    M 196 348 m -12 0 a 12 10 0 1 0 24 0 a 12 10 0 1 0 -24 0 Z
    M 316 348 m -12 0 a 12 10 0 1 0 24 0 a 12 10 0 1 0 -24 0 Z

    M 140 316 C 158 330 166 356 162 384 C 142 368 130 344 130 320 Z
    M 372 316 C 354 330 346 356 350 384 C 370 368 382 344 382 320 Z
  "/>

  <!-- Woody ridges over the mass, giving it grain. -->
  <path fill="url(#wood)" fill-opacity="0.55" d="
    M256 162 C 200 166 154 196 130 240 C 166 206 210 188 256 186 Z"/>
  <path fill="#0a1710" fill-opacity="0.45" d="
    M256 452 C 306 450 348 434 380 402 C 344 424 302 434 256 434 Z"/>

  <!-- Eyes behind their sockets. -->
  <ellipse cx="214" cy="286" rx="17" ry="14" fill="url(#eye)"/>
  <ellipse cx="298" cy="286" rx="17" ry="14" fill="url(#eye)"/>
  <ellipse cx="172" cy="230" rx="9" ry="8" fill="url(#eye)"/>
  <ellipse cx="340" cy="230" rx="9" ry="8" fill="url(#eye)"/>
  <ellipse cx="196" cy="348" rx="8" ry="6" fill="url(#eye)"/>
  <ellipse cx="316" cy="348" rx="8" ry="6" fill="url(#eye)"/>
  <ellipse cx="209" cy="281" rx="6" ry="5" fill="#ffffff" fill-opacity="0.9"/>
  <ellipse cx="293" cy="281" rx="6" ry="5" fill="#ffffff" fill-opacity="0.9"/>

  <!-- Front barbs and root claws, curved forward. -->
  <path fill="#1d3524" d="M186 430 C 172 462 160 480 138 494 C 166 486 188 464 200 438 Z"/>
  <path fill="#1d3524" d="M326 430 C 340 462 352 480 374 494 C 346 486 324 464 312 438 Z"/>
  <path fill="#26432c" d="M240 448 C 236 476 230 492 218 508 C 240 496 252 474 256 452 Z"/>
  <path fill="#26432c" d="M272 448 C 276 476 282 492 294 508 C 272 496 260 474 256 452 Z"/>
</svg>
