<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Hollow Sentinel — Frozen Ruins. A ruined stone warden: cracked monolith
       body, a burning visor slit, and pauldrons floating free of the torso
       because nothing holds them up any more.

       It was a plain rectangle with a stripe. The relief here is cut into the
       ALPHA (joint gap, chest cavity, split), because the shader reads normals
       from alpha only — a painted crack stays flat, a cut one catches a rim. -->
  <defs>
    <radialGradient id="aura" cx="50%" cy="44%" r="52%">
      <stop offset="0.32" stop-color="#3b82f6" stop-opacity="0.26"/>
      <stop offset="0.72" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#3557b5"/>
      <stop offset="0.35" stop-color="#22397d"/>
      <stop offset="0.72" stop-color="#152352"/>
      <stop offset="1" stop-color="#0a1130"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#4a6fd0"/>
      <stop offset="0.6" stop-color="#26407f"/>
      <stop offset="1" stop-color="#111d47"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#93c5fd" stop-opacity="0"/>
      <stop offset="0.16" stop-color="#93c5fd"/>
      <stop offset="0.5" stop-color="#f4faff"/>
      <stop offset="0.84" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#93c5fd" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f0f8ff"/>
      <stop offset="0.4" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="256" cy="230" r="238" fill="url(#aura)"/>

  <!-- The exposed core, behind the pierced chest so the cut edge frames it. -->
  <circle cx="256" cy="304" r="44" fill="url(#core)"/>

  <!-- Head and torso as one contour. Holes: the visor slot, the chest cavity,
       and the joint line separating head from shoulders. -->
  <path fill="url(#stone)" fill-rule="evenodd" d="
    M206 74 L306 74 L318 104 L316 150 L330 168 L318 186 L322 214
    L 356 236 L 362 300 L 352 368 L 336 372 L 330 424 L 300 448
    L 292 428 L 268 452 L 256 430 L 244 452 L 220 428 L 212 448
    L 182 424 L 176 372 L 160 368 L 150 300 L 156 236 L 190 214
    L 194 186 L 182 168 L 196 150 L 194 104 Z

    M 198 170 L 314 170 L 314 182 L 198 182 Z
    M 256 304 m -30 0 a 30 34 0 1 0 60 0 a 30 34 0 1 0 -60 0 Z
    M 249 356 L 263 356 L 269 414 L 243 414 Z
  "/>

  <!-- Lit left face, so the block has a light side and a dark side. -->
  <path fill="#5b81dd" fill-opacity="0.22" d="
    M206 74 L240 74 L232 214 L196 226 L194 104 Z"/>
  <path fill="#5b81dd" fill-opacity="0.14" d="
    M 196 236 L 232 226 L 226 424 L 190 414 Z"/>

  <rect x="202" y="168" width="108" height="15" rx="7" fill="url(#visor)"/>

  <!-- Pauldrons: separate islands, each rimmed on its own. -->
  <path fill="url(#plate)" d="M148 196 L106 226 L100 292 L136 306 L152 250 Z"/>
  <path fill="url(#plate)" d="M364 196 L406 226 L412 292 L376 306 L360 250 Z"/>
  <path fill="#7ea3e8" fill-opacity="0.28" d="M148 196 L120 216 L116 280 L132 288 Z"/>

  <!-- Broken masonry drifting loose. -->
  <polygon points="92,336 66,356 84,382 104,362" fill="#1a2c63"/>
  <polygon points="420,326 446,344 430,372 410,352" fill="#1a2c63"/>
  <polygon points="118,414 100,436 122,450" fill="#162555" fill-opacity="0.5"/>
  <polygon points="396,404 416,424 394,440" fill="#162555" fill-opacity="0.5"/>

  <!-- A crown of chipped teeth along the top edge. -->
  <polygon points="206,74 218,44 230,74" fill="#2a4894"/>
  <polygon points="240,74 256,34 272,74" fill="#35579f"/>
  <polygon points="282,74 294,44 306,74" fill="#2a4894"/>
</svg>
