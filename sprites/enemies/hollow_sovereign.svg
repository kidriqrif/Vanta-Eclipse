<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- The Hollow Sovereign — Dark Forest world boss. A dead king grown into a
       tree: a branching antler crown, a robe of bark, and a chest burned
       hollow around a still-lit ember.

       A boss has to read as a boss at a glance, so it gets what the tier-1
       creatures do not: a wide asymmetric crown breaking the silhouette, an
       open cavity through the torso, and a second light source low in the
       body. Its glow is the elder orange, so it never reads as the violet
       tier it rules over. -->
  <defs>
    <radialGradient id="aura" cx="50%" cy="44%" r="54%">
      <stop offset="0.24" stop-color="#f0562a" stop-opacity="0.20"/>
      <stop offset="0.48" stop-color="#8b5cf6" stop-opacity="0.30"/>
      <stop offset="0.80" stop-color="#8b5cf6" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trunk" x1="0.25" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#493169"/>
      <stop offset="0.35" stop-color="#2c1c50"/>
      <stop offset="0.72" stop-color="#180e33"/>
      <stop offset="1" stop-color="#0a0518"/>
    </linearGradient>
    <linearGradient id="bark" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#6b4a92" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#2c1c50" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0a0518" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ember" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6ec"/>
      <stop offset="0.28" stop-color="#ffc38a"/>
      <stop offset="0.62" stop-color="#f97316"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eye" cx="50%" cy="46%" r="52%">
      <stop offset="0.16" stop-color="#ffffff"/>
      <stop offset="0.40" stop-color="#ffe0c6"/>
      <stop offset="0.72" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c" stop-opacity="0.12"/>
    </radialGradient>
  </defs>

  <circle cx="256" cy="238" r="248" fill="url(#aura)"/>

  <!-- Antler crown: asymmetric on purpose, so the boss never looks stamped. -->
  <path fill="#1c1139" d="M212 96 C 186 62 156 40 116 24 C 152 50 178 80 196 116 Z"/>
  <path fill="#1c1139" d="M170 86 C 150 60 128 46 100 40 C 124 56 142 74 156 96 Z"/>
  <path fill="#251654" d="M300 96 C 326 62 356 40 396 24 C 360 50 334 80 316 116 Z"/>
  <path fill="#251654" d="M342 86 C 362 60 384 46 412 40 C 388 56 370 74 356 96 Z"/>
  <path fill="#2c1c50" d="M234 84 C 228 48 220 26 204 0 C 232 30 248 62 252 82 Z"/>
  <path fill="#2c1c50" d="M278 84 C 284 48 292 26 308 0 C 280 30 264 62 260 82 Z"/>
  <path fill="#1c1139" d="M196 130 C 160 122 130 122 96 132 C 134 132 168 140 196 152 Z"/>
  <path fill="#1c1139" d="M316 130 C 352 122 382 122 416 132 C 378 132 344 140 316 152 Z"/>

  <!-- The ember burning in the hollow, behind the pierced torso. -->
  <circle cx="256" cy="322" r="56" fill="url(#ember)"/>

  <!-- Body. Holes: the eye sockets and the burned-through chest cavity. -->
  <path fill="url(#trunk)" fill-rule="evenodd" d="
    M256 74
    C 306 92 336 136 344 194
    C 352 244 350 292 342 342
    C 334 392 320 428 302 452
    L 316 486 L 286 466 L 274 496 L 256 470 L 238 496 L 226 466 L 196 486 L 210 452
    C 192 428 178 392 170 342
    C 162 292 160 244 168 194
    C 176 136 206 92 256 74 Z

    M 232 168 m -20 0 a 20 26 0 1 0 40 0 a 20 26 0 1 0 -40 0 Z
    M 280 168 m -20 0 a 20 26 0 1 0 40 0 a 20 26 0 1 0 -40 0 Z
    M 256 322 m -34 0 a 34 42 0 1 0 68 0 a 34 42 0 1 0 -68 0 Z
    M 214 396 L 226 392 L 232 444 L 216 442 Z
    M 298 396 L 286 392 L 280 444 L 296 442 Z
  "/>

  <!-- Bark plates: broad lit facets down the left of the trunk. -->
  <path fill="url(#bark)" d="
    M256 82 C 216 100 192 138 182 192
    C 200 148 226 120 256 108 Z"/>
  <path fill="#6b4a92" fill-opacity="0.20" d="
    M184 214 C 178 262 180 312 190 360 L 172 320 C 166 278 170 240 184 214 Z"/>
  <path fill="#0a0518" fill-opacity="0.40" d="
    M326 214 C 334 262 332 312 322 360 L 340 320 C 346 278 340 240 326 214 Z"/>

  <ellipse cx="232" cy="166" rx="13" ry="17" fill="url(#eye)"/>
  <ellipse cx="280" cy="166" rx="13" ry="17" fill="url(#eye)"/>
  <ellipse cx="229" cy="160" rx="4" ry="6" fill="#ffffff" fill-opacity="0.92"/>
  <ellipse cx="277" cy="160" rx="4" ry="6" fill="#ffffff" fill-opacity="0.92"/>

  <!-- Roots trailing off the hem, as separate islands. -->
  <path fill="#1c1139" d="M196 448 C 168 470 140 482 108 486 C 144 486 178 476 204 460 Z"/>
  <path fill="#1c1139" d="M316 448 C 344 470 372 482 404 486 C 368 486 334 476 308 460 Z"/>
  <ellipse cx="140" cy="404" rx="9" ry="12" fill="#3a2470" fill-opacity="0.85"/>
  <ellipse cx="376" cy="392" rx="8" ry="11" fill="#3a2470" fill-opacity="0.85"/>
</svg>
