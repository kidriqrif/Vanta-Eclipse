<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Gloom Wisp — Dark Forest, tier 1. A small hooded spirit trailing torn
       ribbons of shadow.

       Detail here is cut into the ALPHA, not painted on: the shader derives
       its normals from the alpha channel, so a transparent gap gets a real
       bevel, a rim light and a form shadow, while a dark painted shape gets
       none of that and reads flat. Hence the split tail, the pierced hood and
       the sunken eye rings. -->
  <defs>
    <radialGradient id="aura" cx="50%" cy="44%" r="52%">
      <stop offset="0.34" stop-color="#8b5cf6" stop-opacity="0.30"/>
      <stop offset="0.72" stop-color="#8b5cf6" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="body" cx="46%" cy="32%" r="72%">
      <stop offset="0" stop-color="#3d2a71"/>
      <stop offset="0.45" stop-color="#271858"/>
      <stop offset="0.78" stop-color="#180d3a"/>
      <stop offset="1" stop-color="#0d0622"/>
    </radialGradient>
    <linearGradient id="hood" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#4b3487" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#2a1a5e" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#150a33" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="socket" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#0a0518"/>
      <stop offset="1" stop-color="#1c0f3f"/>
    </radialGradient>
    <radialGradient id="eye" cx="50%" cy="46%" r="52%">
      <stop offset="0.18" stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#e9deff"/>
      <stop offset="0.72" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c5cf0" stop-opacity="0.15"/>
    </radialGradient>
  </defs>

  <circle cx="256" cy="232" r="226" fill="url(#aura)"/>

  <!-- Body + hood in one contour. The evenodd subpaths are HOLES: two eye
       sockets and a pair of slits through the hood's brow. -->
  <path fill="url(#body)" fill-rule="evenodd" d="
    M256 40
    C 302 74 340 122 358 178
    C 372 222 376 262 370 300
    C 364 340 346 372 322 392
    C 330 410 330 430 322 448
    C 314 434 302 426 288 424
    C 292 448 286 470 272 488
    C 270 466 262 452 250 444
    C 240 458 236 478 240 498
    C 222 484 212 460 216 434
    C 202 438 190 448 182 462
    C 176 442 178 420 188 402
    C 160 382 140 348 134 306
    C 128 264 132 220 148 176
    C 168 120 208 72 256 40 Z

    M 214 226 m -40 0 a 40 44 0 1 0 80 0 a 40 44 0 1 0 -80 0 Z
    M 298 226 m -40 0 a 40 44 0 1 0 80 0 a 40 44 0 1 0 -80 0 Z
    M 206 138 C 220 128 232 124 244 124 C 232 136 220 144 206 150 Z
    M 306 138 C 292 128 280 124 268 124 C 280 136 292 144 306 150 Z
  "/>

  <!-- Lit face of the hood: a single soft plane so the head does not read as
       one undifferentiated mass. -->
  <path fill="url(#hood)" d="
    M256 52 C 300 84 332 128 348 178
    C 322 150 292 132 256 126
    C 220 132 190 150 164 178
    C 180 128 212 84 256 52 Z"/>

  <!-- Sockets sit BEHIND the pierced body, so the cut edge above catches the
       bevel and the glow reads as recessed rather than stuck on. -->
  <ellipse cx="214" cy="226" rx="34" ry="38" fill="url(#socket)"/>
  <ellipse cx="298" cy="226" rx="34" ry="38" fill="url(#socket)"/>
  <ellipse cx="214" cy="224" rx="22" ry="26" fill="url(#eye)"/>
  <ellipse cx="298" cy="224" rx="22" ry="26" fill="url(#eye)"/>
  <ellipse cx="209" cy="215" rx="7" ry="9" fill="#ffffff" fill-opacity="0.92"/>
  <ellipse cx="293" cy="215" rx="7" ry="9" fill="#ffffff" fill-opacity="0.92"/>

  <!-- Trailing motes: separate islands, so each gets its own rim. -->
  <ellipse cx="150" cy="416" rx="11" ry="14" fill="#3a2470" fill-opacity="0.9"/>
  <ellipse cx="368" cy="404" rx="9" ry="12" fill="#3a2470" fill-opacity="0.9"/>
  <circle cx="132" cy="360" r="7" fill="#5b3fa8" fill-opacity="0.7"/>
  <circle cx="384" cy="346" r="6" fill="#5b3fa8" fill-opacity="0.7"/>
</svg>
