<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Hunter's Sigil. Frame: a downward shield, the only relic with a flat top
       and a point at the bottom — the exact inverse of the Essence Prism's
       diamond, so the two never blur together in a list. -->
  <defs>
    <radialGradient id="au" cx="50%" cy="50%" r="50%">
      <stop offset="0.32" stop-color="#f5c451" stop-opacity="0.5"/>
      <stop offset="0.70" stop-color="#f5c451" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#f5c451" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fr" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fff3cf"/>
      <stop offset="0.42" stop-color="#f5c451"/>
      <stop offset="1" stop-color="#8f6417"/>
    </linearGradient>
    <linearGradient id="head" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#fff3cf"/>
      <stop offset="1" stop-color="#c79433"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="62" fill="url(#au)"/>

  <!-- Shield frame, hollow. -->
  <path fill="url(#fr)" fill-rule="evenodd" d="
    M12 10 L116 10 L116 62 C 116 92 96 114 64 126 C 32 114 12 92 12 62 Z
    M26 24 L26 62 C 26 85 41 102 64 112 C 87 102 102 85 102 62 L102 24 Z"/>
  <!-- Notches in the top rail, so the flat edge is not a plain bar. -->
  <polygon points="40,10 46,22 34,22" fill="#8f6417"/>
  <polygon points="88,10 94,22 82,22" fill="#8f6417"/>

  <!-- Arrowhead driven down through the shield. -->
  <polygon points="64,28 88,72 64,62 40,72" fill="url(#head)"/>
  <polygon points="64,28 64,62 40,72" fill="#ffffff" fill-opacity="0.5"/>
  <polygon points="60,66 68,66 68,104 64,110 60,104" fill="#c79433"/>
  <!-- Fletching. -->
  <polygon points="60,84 48,94 60,96" fill="#8f6417"/>
  <polygon points="68,84 80,94 68,96" fill="#8f6417"/>
  <circle cx="64" cy="40" r="3" fill="#ffffff" fill-opacity="0.85"/>
</svg>
