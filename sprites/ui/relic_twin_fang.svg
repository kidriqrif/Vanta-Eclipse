<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Twin Fang. Frame: a torn claw arc.

       All five relic sigils used to share one identical octagon frame with a
       small glyph inside it, so at the 44px they are actually drawn at, the
       relic list was five copies of the same gold badge. The frame SHAPE is
       now what tells them apart — silhouette is the only thing that survives
       at that size — while the gold keeps them a family. -->
  <defs>
    <radialGradient id="au" cx="50%" cy="50%" r="50%">
      <stop offset="0.32" stop-color="#c8c8d0" stop-opacity="0.5"/>
      <stop offset="0.70" stop-color="#c8c8d0" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#c8c8d0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fr" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f4f4f6"/>
      <stop offset="0.42" stop-color="#c8c8d0"/>
      <stop offset="1" stop-color="#4a4a52"/>
    </linearGradient>
    <linearGradient id="tooth" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#f4f4f6"/>
      <stop offset="1" stop-color="#8e8e98"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="62" fill="url(#au)"/>

  <!-- Broken claw ring, open at the top where the fangs come through. -->
  <path fill="url(#fr)" d="
    M64 8 C 40 8 20 24 12 48 C 6 68 10 90 24 106 L 36 96
    C 26 84 22 66 26 52 C 32 32 46 20 64 20 Z"/>
  <path fill="url(#fr)" d="
    M64 8 C 88 8 108 24 116 48 C 122 68 118 90 104 106 L 92 96
    C 102 84 106 66 102 52 C 96 32 82 20 64 20 Z"/>
  <path fill="#4a4a52" d="M24 106 L14 118 L38 112 L36 96 Z"/>
  <path fill="#4a4a52" d="M104 106 L114 118 L90 112 L92 96 Z"/>

  <!-- The pair of fangs, curved apart so the shape is never symmetrical. -->
  <path fill="url(#tooth)" d="M46 30 C 50 60 54 82 62 104 C 54 78 52 54 56 30 Z"/>
  <path fill="url(#tooth)" d="M82 30 C 78 60 74 82 66 104 C 74 78 76 54 72 30 Z"/>
  <path fill="#ffffff" fill-opacity="0.55" d="M46 30 C 49 56 51 74 56 90 C 54 68 52 48 54 30 Z"/>
  <circle cx="64" cy="24" r="5" fill="#f4f4f6"/>
</svg>
