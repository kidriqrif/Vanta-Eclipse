<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#494949"/>
      <stop offset="1" stop-color="#2c2c2c"/>
    </linearGradient>
  </defs>
  <!-- page block behind the cover -->
  <rect x="34" y="20" width="72" height="88" rx="6" fill="#e7e7e7"/>
  <rect x="34" y="20" width="72" height="88" rx="6" fill="none" stroke="#b8b8b8" stroke-width="3"/>
  <!-- cover -->
  <rect x="22" y="16" width="76" height="96" rx="8" fill="url(#cover)" stroke="#6a5a92" stroke-width="4"/>
  <!-- spine -->
  <rect x="22" y="16" width="14" height="96" rx="6" fill="#262626"/>
  <!-- embossed rule -->
  <rect x="48" y="46" width="38" height="5" rx="2.5" fill="#b8b8b8" fill-opacity="0.8"/>
  <rect x="48" y="62" width="26" height="5" rx="2.5" fill="#b8b8b8" fill-opacity="0.55"/>
</svg>
