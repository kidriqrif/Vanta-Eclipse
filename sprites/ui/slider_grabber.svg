<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="gglow" cx="50%" cy="50%" r="50%">
      <stop offset="0.34" stop-color="#FF3B30" stop-opacity="0.5"/>
      <stop offset="0.7" stop-color="#FF3B30" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FF3B30" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD9D6"/>
      <stop offset="0.48" stop-color="#FF3B30"/>
      <stop offset="1" stop-color="#7E0B14"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#gglow)"/>
  <!-- the knob: deep rim so it reads against the pink fill it sits on -->
