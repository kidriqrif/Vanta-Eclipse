<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Eclipse Heart. Frame: an unbroken corona ring with rays — the only
       fully round, fully closed relic outline, so it reads as the complete
       one against Shatterstone's broken ring. -->
  <defs>
    <radialGradient id="au" cx="50%" cy="50%" r="50%">
      <stop offset="0.30" stop-color="#c8c8d0" stop-opacity="0.55"/>
      <stop offset="0.68" stop-color="#c8c8d0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#c8c8d0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fr" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f4f4f6"/>
      <stop offset="0.42" stop-color="#c8c8d0"/>
      <stop offset="1" stop-color="#4a4a52"/>
    </linearGradient>
    <radialGradient id="corona" cx="50%" cy="50%" r="50%">
      <stop offset="0.52" stop-color="#ededf0" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#f4f4f6" stop-opacity="0.95"/>
      <stop offset="0.9" stop-color="#c8c8d0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#c8c8d0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="64" cy="64" r="62" fill="url(#au)"/>

  <!-- Eight rays, long/short alternating so the ring is never a plain star. -->
  <g fill="url(#fr)">
    <polygon points="64,0 70,22 58,22"/>
    <polygon points="128,64 106,70 106,58"/>
    <polygon points="64,128 58,106 70,106"/>
    <polygon points="0,64 22,58 22,70"/>
    <polygon points="108,20 96,38 90,32"/>
    <polygon points="108,108 90,96 96,90"/>
    <polygon points="20,108 32,90 38,96"/>
    <polygon points="20,20 38,32 32,38"/>
  </g>

  <!-- The corona itself, then the disc that eclipses it. -->
  <circle cx="64" cy="64" r="40" fill="url(#corona)"/>
  <circle cx="64" cy="64" r="31" fill="#c8c8d0"/>
  <circle cx="64" cy="64" r="27" fill="#0c0c0c"/>
  <!-- A heart pulsing inside the shadow — the relic's name, not a generic mark. -->
  <path fill="#f4f4f6" d="
    M64 78 C 52 70 46 62 46 55 C 46 49 51 46 56 47 C 60 48 63 51 64 54
    C 65 51 68 48 72 47 C 77 46 82 49 82 55 C 82 62 76 70 64 78 Z"/>
  <path fill="#c8c8d0" fill-opacity="0.85" d="
    M64 72 C 56 66 52 61 52 56 C 52 53 55 51 58 52 C 61 53 63 55 64 57
    C 65 55 67 53 70 52 C 73 51 76 53 76 56 C 76 61 72 66 64 72 Z"/>
  <circle cx="55" cy="53" r="3" fill="#ffffff" fill-opacity="0.8"/>
</svg>
