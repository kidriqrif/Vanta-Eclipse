<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Shatterstone. Frame: a ring split into four drifting arcs — the only
       relic whose outline is discontinuous, which is what makes it readable at
       44px next to the others. -->
  <defs>
    <radialGradient id="au" cx="50%" cy="50%" r="50%">
      <stop offset="0.32" stop-color="#f5c451" stop-opacity="0.5"/>
      <stop offset="0.70" stop-color="#f5c451" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#f5c451" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fr" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fff3cf"/>
      <stop offset="0.42" stop-color="#f5c451"/>
      <stop offset="1" stop-color="#8f6417"/>
    </linearGradient>
    <linearGradient id="rock" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#fff3cf"/>
      <stop offset="0.4" stop-color="#e0ac3e"/>
      <stop offset="1" stop-color="#6f4c12"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="62" fill="url(#au)"/>

  <!-- Four ring fragments, each thrown a little off the circle. -->
  <path fill="url(#fr)" d="M64 6 L96 20 L92 30 L64 18 Z"/>
  <path fill="url(#fr)" d="M108 34 L122 66 L112 70 L100 42 Z"/>
  <path fill="url(#fr)" d="M110 96 L82 122 L74 114 L100 88 Z"/>
  <path fill="url(#fr)" d="M18 100 L8 66 L18 62 L28 92 Z"/>
  <path fill="#8f6417" d="M20 30 L38 12 L44 20 L28 38 Z"/>

  <!-- The stone itself, split down the middle with a lit fissure between. -->
  <path fill="url(#rock)" d="M58 34 L86 54 L76 92 L52 84 L44 58 Z"/>
  <path fill="#6f4c12" d="M58 34 L52 62 L52 84 L44 58 Z"/>
  <path fill="#fff3cf" fill-opacity="0.55" d="M58 34 L70 44 L60 62 L52 62 Z"/>
  <path fill="none" stroke="#fffaf0" stroke-width="3" stroke-linecap="round"
        d="M60 36 L56 60 L70 66 L64 88"/>
  <!-- Chips flying off. -->
  <polygon points="34,74 26,84 38,86" fill="#e0ac3e"/>
  <polygon points="92,66 102,74 90,80" fill="#e0ac3e"/>
  <polygon points="66,100 62,112 76,106" fill="#c79433"/>
</svg>
