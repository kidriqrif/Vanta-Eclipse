<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="corona" cx="50%" cy="50%" r="50%">
      <stop offset="0.42" stop-color="#66dbd8" stop-opacity="0"/>
      <stop offset="0.52" stop-color="#c2f7f4" stop-opacity="0.9"/>
      <stop offset="0.62" stop-color="#66dbd8" stop-opacity="0.45"/>
      <stop offset="0.85" stop-color="#66dbd8" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#66dbd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="disc" cx="42%" cy="40%" r="62%">
      <stop offset="0" stop-color="#1a2430"/>
