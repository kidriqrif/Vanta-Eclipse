<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="cglow" cx="50%" cy="50%" r="50%">
      <stop offset="0.3" stop-color="#c6c6c6" stop-opacity="0.5"/>
      <stop offset="0.7" stop-color="#c6c6c6" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#c6c6c6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ededed"/>
      <stop offset="0.55" stop-color="#c6c6c6"/>
