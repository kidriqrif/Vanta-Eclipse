      <stop offset="0.3" stop-color="#66dbd8" stop-opacity="0.5"/>
      <stop offset="0.7" stop-color="#66dbd8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#66dbd8" stop-opacity="0"/>
