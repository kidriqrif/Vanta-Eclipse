<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="rglow" cx="50%" cy="50%" r="50%">
      <stop offset="0.34" stop-color="#d8d8d8" stop-opacity="0.42"/>
      <stop offset="0.74" stop-color="#d8d8d8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#d8d8d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rcore" cx="42%" cy="38%" r="62%">
      <stop offset="0" stop-color="#f8f8f8"/>
      <stop offset="0.6" stop-color="#d8d8d8"/>
      <stop offset="1" stop-color="#646464"/>
    </radialGradient>
  </defs>
  <circle cx="64" cy="64" r="60" fill="url(#rglow)"/>
  <!-- outer ring -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="#d8d8d8" stroke-width="4" stroke-opacity="0.75"/>
  <!-- four cardinal ticks: the sigil reads by shape, not colour alone -->
  <rect x="61" y="6" width="6" height="16" rx="3" fill="#d8d8d8"/>
  <rect x="61" y="106" width="6" height="16" rx="3" fill="#d8d8d8"/>
  <rect x="6" y="61" width="16" height="6" rx="3" fill="#d8d8d8"/>
  <rect x="106" y="61" width="16" height="6" rx="3" fill="#d8d8d8"/>
  <!-- core -->
  <circle cx="64" cy="64" r="26" fill="url(#rcore)"/>
  <circle cx="56" cy="55" r="8" fill="#f8f8f8" fill-opacity="0.55"/>
</svg>
