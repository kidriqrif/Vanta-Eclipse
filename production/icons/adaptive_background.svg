<svg xmlns="http://www.w3.org/2000/svg" width="432" height="432" viewBox="0 0 432 432">
  <!-- Adaptive icon BACKGROUND layer (Android 8+).

       Must be fully opaque and fill all 432px: the launcher masks it to
       whatever shape the device uses, and any transparent pixel becomes a
       hole in the icon. Deliberately almost flat — the corona in the
       foreground layer is the only thing that should draw the eye, and a
       busy background is what makes adaptive icons look muddy at 48px.

       The faint red lift behind centre is what keeps the black from reading
       as a dead rectangle on an AMOLED launcher. -->
  <defs>
    <radialGradient id="lift" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF3B30" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#FF3B30" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FF3B30" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="432" height="432" fill="#0B0B0D"/>
  <rect width="432" height="432" fill="url(#lift)"/>
</svg>
