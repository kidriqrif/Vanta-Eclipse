<svg xmlns="http://www.w3.org/2000/svg" width="432" height="432" viewBox="0 0 432 432">
  <!-- Adaptive icon FOREGROUND layer (Android 8+).

       432px = 108dp at 4x. The launcher may mask this to a circle, a squircle
       or a rounded square, and it also animates/parallaxes the layer, so only
       the central 66dp is guaranteed visible: a 264px circle, radius 132,
       centred at (216, 216). Every opaque pixel of the mark below sits inside
       that radius — the corona's outer edge is r=118, leaving 14px of slack.

       Transparent background by design: the background layer supplies the
       black. -->
  <defs>
    <linearGradient id="corona" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FF6B62"/>
      <stop offset="0.45" stop-color="#FF3B30"/>
      <stop offset="1" stop-color="#A8101A"/>
    </linearGradient>
  </defs>

  <!-- corona, then the occluding disc — punched to transparent, not to black,
       so the background layer shows through and parallax cannot reveal a seam -->
  <path fill="url(#corona)" fill-rule="evenodd"
        d="M216 98 A118 118 0 1 0 216.1 98 Z
           M216 136 A80 80 0 1 1 215.9 136 Z"/>

  <!-- rim light along the top-left -->
  <path d="M132.6 132.6 A118 118 0 0 1 216 98" fill="none" stroke="#FFD9D6"
        stroke-opacity="0.55" stroke-width="11" stroke-linecap="round"/>
  <!-- diamond-ring bead, on the ring midline (r=99) -->
  <circle cx="146" cy="146" r="16" fill="#FFD9D6"/>
  <circle cx="146" cy="146" r="7" fill="#FFFFFF"/>
</svg>
